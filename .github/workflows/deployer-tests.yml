name: deployer-tests

# Unit tests for the production pull deployer (infra/deployer). GitHub-hosted on
# purpose: stdlib-only Python plus git, no access to any host.
on:
  push:
    branches: [master]
    paths:
      - 'infra/deployer/**'
      - '.github/workflows/deployer-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'infra/deployer/**'
      - '.github/workflows/deployer-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    name: deployer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        working-directory: infra/deployer
        run: python -m unittest discover -s tests -t . -v
      - name: Validate deployer compose file
        working-directory: infra/deployer
        run: docker compose -f docker-compose.yml config --quiet
